<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1200" viewBox="0 0 1600 1200" role="img" aria-labelledby="title desc">
<title id="title">Fieldkit product cover template</title>
<desc id="desc">An editable 4:3 warm-paper cover template with Fieldkit figure numbering and vermilion folded corner.</desc>
<rect width="1600" height="1200" fill="#F3EBDD"/>
<path d="M0 0 H1600 V1200 H0 Z" fill="none" stroke="#DED4C6" stroke-width="2"/>
<path d="M1450 0 H1600 V150 Z" fill="#B5381F"/>
<g fill="#211D18">
  <text x="110" y="120" font-family="Geist, Inter, Arial, sans-serif" font-size="30" font-weight="700" letter-spacing="8">FIELDKIT</text>
  <text x="1490" y="120" text-anchor="end" font-family="Geist, Inter, Arial, sans-serif" font-size="27" font-weight="650" letter-spacing="7">FIG. 001</text>
</g>
<path d="M110 170 H1490" stroke="#211D18" stroke-width="3" opacity="0.75"/>
<text x="110" y="330" fill="#B5381F" font-family="Geist, Inter, Arial, sans-serif" font-size="28" font-weight="700" letter-spacing="8">[PRODUCT CATEGORY]</text>
<text x="110" y="570" fill="#211D18" font-family="Newsreader, Georgia, serif" font-size="145" font-weight="700">[Product title]</text>
<text x="115" y="660" fill="#3D362F" font-family="Geist, Inter, Arial, sans-serif" font-size="38">[One clear sentence about what this kit helps you do.]</text>
<path d="M110 1000 H1490" stroke="#DED4C6" stroke-width="3"/>
<text x="110" y="1070" fill="#211D18" font-family="Geist, Inter, Arial, sans-serif" font-size="25" font-weight="700" letter-spacing="8">PRACTICAL KITS BY CHETAN</text>
<circle cx="1490" cy="1058" r="13" fill="#B5381F"/>
</svg>
